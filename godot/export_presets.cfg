; Export Windows du port Godot (voir docs/GODOT_PORT.md, section « J21 / port Windows »). Lancé par tools/export-windows.sh.
; Les chemins du filtre sont relatifs à godot/. Les assets cuits (ignorés par git) doivent exister au moment de l'export.
; ATTENTION : Godot n'exporte JAMAIS les dossiers contenant un .gdignore (assets/baked, textures, graphics, tram : PNG/JPG lus en brut par
; Image.load_from_file). tools/export-windows.sh les ajoute au .pck après coup (tools/pck-tool.py add + tools/pck-pack.gd).
[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
advanced_options=false
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json, data/graphics/*, data/world/*, assets/weapons/LICENSE.txt, assets/zombies/LICENSE.txt"
exclude_filter="tests/*, data/golden/*, data/world/golden_j2.json, *.md, *.ico, assets/audio/music/theme.*, assets/audio/music/LISEZMOI.txt"
export_path="build/windows/ZombieSurvival/Zombie.exe"
patch_list=PackedStringArray()
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=2
binary_format/embed_pck=false
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=true
application/icon="res://icon.ico"
application/console_wrapper_icon=""
application/icon_interpolation=4
application/file_version="0.18.0.0"
application/product_version="0.18.0.0"
application/company_name="Zombie Survival"
application/product_name="Zombie Survival"
application/file_description="Zombie Survival (port Godot)"
application/copyright="Port Godot de Zombie Survival"
application/trademarks=""
application/export_angle=0
application/export_d3d12=0
application/d3d12_agility_sdk_multiarch=true

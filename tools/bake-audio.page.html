<!doctype html><meta charset="utf-8"><title>bake audio</title>
<script type="module">
import { Sfx } from '/src/audio.js';
import { Music } from '/src/music.js';
import { noiseBuffer, satCurve, reverbBuffer } from '/src/dsp.js';
const RATE = 44100;
const b64 = (f32) => { const u = new Uint8Array(f32.buffer, f32.byteOffset, f32.byteLength); let s = ''; for (let i = 0; i < u.length; i += 0x8000) s += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(s); };
// Chaîne « sèche » : le bus part sur le canal 0, l'envoi vers la réverbération sur le canal 1 (refaite par les bus Godot)
function dryChain(ctx) {
  const sfx = new Sfx();
  sfx.ctx = ctx;
  const merger = ctx.createChannelMerger(2); merger.connect(ctx.destination);
  sfx.noiseBuf = noiseBuffer(ctx, 2);
  sfx.bus = ctx.createGain(); sfx.bus.connect(merger, 0, 0);
  sfx.verbIn = ctx.createGain(); sfx.verbIn.connect(merger, 0, 1);
  sfx.dist = ctx.createWaveShaper(); sfx.dist.curve = satCurve(4); sfx.dist.connect(sfx.bus);
  sfx.music = null;
  return sfx;
}
window.renderSfx = async (call, args, dur) => {
  const ctx = new OfflineAudioContext(2, Math.ceil(dur * RATE), RATE);
  const sfx = dryChain(ctx);
  sfx[call](...args);
  const buf = await ctx.startRendering();
  return { dry: b64(buf.getChannelData(0)), send: b64(buf.getChannelData(1)) };
};
window.renderEngine = async (create, kind, p, dur) => {
  const ctx = new OfflineAudioContext(2, Math.ceil(dur * RATE), RATE);
  const sfx = dryChain(ctx);
  const e = create === 'createEngine' ? sfx.createEngine(kind) : sfx.createTramEngine();
  if (create === 'createEngine') e.set(p.rpm, p.throttle, p.ratio, 1); else e.set(p.ratio, p.throttle, 1);
  const buf = await ctx.startRendering();
  return { dry: b64(buf.getChannelData(0)), send: b64(buf.getChannelData(1)) };
};
// Musique : la chaîne du jeu (réverbération partagée, bus à 0,6) sans le compresseur ; volume de la musique à 1 (réglé par le bus Godot)
window.renderMusic = async (spec, bars) => {
  const ctx0 = new OfflineAudioContext(2, 1, RATE);
  const probe = new Music(ctx0, ctx0.createGain(), { noise: noiseBuffer(ctx0, 1) });
  probe.lull = !!spec.lull; probe.intensity = spec.intensity;
  const x = spec.lull ? 0 : spec.intensity;
  const bpm = 102 + 34 * x, stepDur = 60 / bpm / 4, loop = bars * 16 * stepDur, tail = 3;
  const t0 = 0.05;
  const ctx = new OfflineAudioContext(2, Math.ceil((t0 + loop + tail) * RATE), RATE);
  const bus = ctx.createGain(); bus.gain.value = 0.6; bus.connect(ctx.destination);
  const noise = noiseBuffer(ctx, 2);
  const verb = ctx.createConvolver(); verb.buffer = reverbBuffer(ctx);
  const verbOut = ctx.createGain(); verbOut.gain.value = 0.55;
  const verbIn = ctx.createGain(); verbIn.connect(verb).connect(verbOut).connect(bus);
  const m = new Music(ctx, bus, { noise, reverb: verbIn });
  m.vol.gain.value = 1; m.setIntensity(spec.intensity); m.setLull(!!spec.lull);
  m.nextTime = t0;
  m._pump(t0 + loop - 1e-6);
  const buf = await ctx.startRendering();
  return { l: b64(buf.getChannelData(0)), r: b64(buf.getChannelData(1)), t0, loop, bpm, level: m.level };
};
window.bakeReady = true;
</script>
